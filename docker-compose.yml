version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    container_name: genieacs-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - genieacs

  genieacs:
    image: drumsergio/genieacs:1.2.16.6
    container_name: genieacs
    restart: unless-stopped
    environment:
      - GENIEACS_UI_JWT_SECRET=secret
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://genieacs-mongodb:27017/genieacs
      - GENIEACS_EXT_DIR=/opt/genieacs/ext
    volumes:
      - ./ext:/opt/genieacs/ext
    ports:
      - "3000:3000"
      - "7547:7547"
      - "7557:7557"
      - "7567:7567"
    depends_on:
      - mongodb
    networks:
      - genieacs

  nginx:
    image: nginx:alpine
    container_name: genieacs-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./logos:/usr/share/nginx/logos:ro
    depends_on:
      - genieacs
    networks:
      - genieacs

volumes:
  mongodb_data:

networks:
  genieacs:
    name: genieacs
